<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Itinerary Builder - GlobeTrotter</title>

    <link rel="stylesheet" href="cssfiles/global.css">
    <link rel="stylesheet" href="cssfiles/itinerary.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
                class="dashboard-logo">
                🌍 GlobeTrotter
            </a>

            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a href="my-trips.html">
                    My Trips
                </a>

                <a
                    href="itinerary-builder.html"
                    class="active"
                >
                    Itinerary
                </a>

                <a href="community.html">
                    Community
                </a>

            </div>

            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button"
                >
                    👤
                </a>

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- HERO -->

    <section class="itinerary-hero">

        <div class="itinerary-hero-content">

            <div>

                <p class="page-label">
                    PLAN YOUR JOURNEY
                </p>

                <h1 id="tripTitle">
                    Itinerary Builder
                </h1>

                <p id="tripDestination">
                    Build your perfect day-by-day trip.
                </p>

            </div>

            <a
                id="viewTripButton"
                href="#"
                class="view-trip-btn">
                View Trip
            </a>

        </div>

    </section>


    <!-- MAIN -->

    <main class="itinerary-container">

        <div
            id="loading"
            class="itinerary-loading"
        >
            Loading trip...
        </div>


        <div
            id="itineraryDays"
            class="itinerary-days"
        >
        </div>

    </main>


    <!-- ADD ACTIVITY MODAL -->

    <div
        id="activityModal"
        class="modal-overlay"
    >

        <div class="activity-modal">

            <div class="modal-header">

                <div>

                    <p class="page-label">
                        ADD TO DAY
                    </p>

                    <h2 id="modalDayTitle">
                        Add Activity
                    </h2>

                </div>

                <button
                    id="closeModal"
                    class="close-modal"
                >
                    ×
                </button>

            </div>


            <form id="activityForm">

                <input
                    type="hidden"
                    id="selectedItineraryId"
                >


                <div class="form-group">

                    <label>
                        Activity Name
                    </label>

                    <input
                        type="text"
                        id="activityName"
                        placeholder="e.g. Visit City Palace"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="startTime"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            End Time
                        </label>

                        <input
                            type="time"
                            id="endTime"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        id="activityLocation"
                        placeholder="e.g. City Palace, Udaipur"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Estimated Cost
                    </label>

                    <input
                        type="number"
                        id="activityCost"
                        min="0"
                        placeholder="₹ 0"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="activityDescription"
                        rows="3"
                        placeholder="Add some notes..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-activity-btn"
                >
                    Add Activity
                </button>

            </form>

        </div>

    </div>


    <script src="jsfiles/api.js"></script>
    <script src="jsfiles/itinerary-builder.js"></script>

</body>

</html>
