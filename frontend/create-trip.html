<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobeTrotter - Create Trip</title>

    <link rel="stylesheet" href="cssfiles/global.css">

    <style>
        .create-trip-page {
            max-width: 850px;
            margin: auto;
            padding: 30px 20px;
        }

        .trip-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .trip-header h1 {
            margin-bottom: 8px;
        }

        .trip-header p {
            color: #666;
        }

        .trip-form-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .destination-preview {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .destination-preview strong {
            color: #1d4ed8;
        }

        .date-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .success-message {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .create-trip-page {
                padding: 20px 12px;
            }

            .trip-form-card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🌍 GlobeTrotter
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="my-trips.html">
                My Trips
            </a>

            <a href="calendar.html">
                Calendar
            </a>

            <a href="search.html">
                Search
            </a>

            <a href="community.html">
                Community
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

        <button
            class="menu-toggle"
            id="menuToggle"
        >
            ☰
        </button>

    </nav>


    <!-- Main -->

    <main class="create-trip-page">

        <div class="trip-header">

            <h1>
                ✈️ Create Your Trip
            </h1>

            <p>
                Plan your next adventure with GlobeTrotter.
            </p>

        </div>


        <section class="trip-form-card">

            <div
                class="success-message"
                id="successMessage"
            >
                🎉 Trip created successfully!
            </div>


            <!-- Destination Preview -->

            <div
                class="destination-preview"
                id="destinationPreview"
            >
                📍 Selected Destination:
                <strong id="selectedDestination">
                    Not selected
                </strong>
            </div>


            <!-- Form -->

            <form id="tripForm">

                <!-- Trip Name -->

                <div class="form-group">

                    <label for="tripName">
                        Trip Name *
                    </label>

                    <input
                        type="text"
                        id="tripName"
                        placeholder="Example: Goa Vacation"
                        required
                    >

                </div>


                <!-- Destination -->

                <div class="form-group">

                    <label for="destination">
                        Destination *
                    </label>

                    <input
                        type="text"
                        id="destination"
                        placeholder="Enter destination"
                        required
                    >

                </div>


                <!-- Dates -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="startDate">
                            Start Date *
                        </label>

                        <input
                            type="date"
                            id="startDate"
                            required
                        >

                        <div
                            class="date-error"
                            id="startDateError"
                        >
                            Please select a valid future date.
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="endDate">
                            End Date *
                        </label>

                        <input
                            type="date"
                            id="endDate"
                            required
                        >

                        <div
                            class="date-error"
                            id="endDateError"
                        >
                            End date must be after start date.
                        </div>

                    </div>

                </div>


                <!-- Travellers -->

                <div class="form-group">

                    <label for="travellers">
                        Number of Travellers *
                    </label>

                    <input
                        type="number"
                        id="travellers"
                        min="1"
                        max="50"
                        value="1"
                        required
                    >

                </div>


                <!-- Budget -->

                <div class="form-group">

                    <label for="budget">
                        Budget
                    </label>

                    <select id="budget">

                        <option value="low">
                            Low - ₹10,000 to ₹20,000
                        </option>

                        <option value="medium" selected>
                            Medium - ₹20,000 to ₹50,000
                        </option>

                        <option value="high">
                            High - ₹50,000+
                        </option>

                    </select>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Trip Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Tell us about your trip..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Create Trip ✈️
                </button>

            </form>

        </section>

    </main>


    <script src="jsfiles/create-trip.js"></script>

</body>
</html>
