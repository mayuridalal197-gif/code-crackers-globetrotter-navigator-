<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlobeTrotter - Community</title>

    <link rel="stylesheet" href="css/global.css">

    <style>
        .community-page {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .community-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .community-header h1 {
            margin-bottom: 10px;
        }

        .community-header p {
            color: #666;
        }

        /* Create Post */

        .create-post {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .create-post textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .create-post textarea:focus {
            border-color: #2563eb;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        .image-label {
            cursor: pointer;
            color: #2563eb;
            font-weight: 500;
        }

        #imageInput {
            display: none;
        }

        .post-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .post-btn:hover {
            background: #1d4ed8;
        }

        /* Posts */

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .user-info h3 {
            margin: 0;
            font-size: 16px;
        }

        .user-info span {
            color: #888;
            font-size: 13px;
        }

        .post-content {
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .post-footer {
            display: flex;
            gap: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .post-footer button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            color: #555;
        }

        .post-footer button:hover {
            color: #2563eb;
        }

        .liked {
            color: #e11d48 !important;
        }

        .comments {
            margin-top: 15px;
            display: none;
        }

        .comments.show {
            display: block;
        }

        .comment {
            background: #f7f7f7;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .community-page {
                padding: 20px 12px;
            }

            .create-post,
            .post-card {
                padding: 16px;
            }

            .post-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .post-btn {
                width: 100%;
            }

            .post-footer {
                justify-content: space-between;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🌍 GlobeTrotter
        </div>

        <div class="nav-links">

            <a href="dashboard.html">Dashboard</a>

            <a href="my-trips.html">My Trips</a>

            <a href="calendar.html">Calendar</a>

            <a href="community.html" class="active">
                Community
            </a>

            <a href="profile.html">Profile</a>

        </div>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

    </nav>


    <!-- Community -->

    <main class="community-page">

        <div class="community-header">

            <h1>🌍 Travel Community</h1>

            <p>
                Share your travel experiences, tips and memories
                with fellow travellers.
            </p>

        </div>


        <!-- Create Post -->

        <section class="create-post">

            <textarea
                id="postText"
                placeholder="Share your travel experience..."
            ></textarea>

            <div class="post-actions">

                <label
                    for="imageInput"
                    class="image-label"
                >
                    📷 Add Photo
                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <button
                    class="post-btn"
                    id="postBtn"
                >
                    Share Post
                </button>

            </div>

        </section>


        <!-- Posts -->

        <section
            class="posts-container"
            id="postsContainer"
        >

            <!-- Posts generated by JavaScript -->

        </section>

    </main>


    <script src="js/community.js"></script>

</body>
</html>
