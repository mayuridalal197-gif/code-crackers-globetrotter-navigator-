<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Destinations - GlobeTrotter</title>


    <link
        rel="stylesheet"
        href="cssfiles/global.css"
    >

    <link
        rel="stylesheet"
        href="cssfiles/search.css"
    >

</head>


<body>


    <!-- =====================================
         NAVBAR
    ====================================== -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">


            <a
                href="dashboard.html"
                class="dashboard-logo"
            >
                🌍 GlobeTrotter
            </a>


            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a href="my-trips.html">
                    My Trips
                </a>

                <a
                    href="search.html"
                    class="active"
                >
                    Search
                </a>

                <a href="community.html">
                    Community
                </a>

            </div>


            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button"
                >
                    👤
                </a>


                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>


        </div>

    </nav>



    <!-- =====================================
         SEARCH HEADER
    ====================================== -->

    <header class="search-header">

        <div class="search-header-content">


            <p class="search-label">
                EXPLORE THE WORLD
            </p>


            <h1>
                Find Your Next Destination
            </h1>


            <p>
                Discover amazing destinations,
                explore new places and start
                planning your next adventure.
            </p>


            <form
                id="searchForm"
                class="search-form"
            >

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Paris, Dubai, Tokyo..."
                    autocomplete="off"
                >


                <button
                    type="submit"
                >
                    🔍 Search
                </button>

            </form>


        </div>

    </header>



    <!-- =====================================
         RESULTS
    ====================================== -->

    <main class="search-results-section">


        <div
            id="searchResults"
            class="search-results"
        >

            <div class="search-message">

                <h3>
                    Explore destinations
                </h3>

                <p>
                    Search for Paris, Dubai,
                    Tokyo, London or Bali.
                </p>

            </div>

        </div>


    </main>



    <!-- =====================================
         SCRIPTS
    ====================================== -->

    <script src="jsfiles/api.js"></script>

    <script src="jsfiles/search.js"></script>


</body>

</html>
