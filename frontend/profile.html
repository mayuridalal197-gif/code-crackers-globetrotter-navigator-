<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - GlobeTrotter</title>

    <link rel="stylesheet" href="cssfiles/global.css">
    <link rel="stylesheet" href="cssfiles/profile.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
                class="dashboard-logo"
            >
                🌍 GlobeTrotter
            </a>


            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a href="my-trips.html">
                    My Trips
                </a>

                <a href="community.html">
                    Community
                </a>

            </div>


            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button active"
                >
                    👤
                </a>

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- PROFILE -->

    <main class="profile-page">

        <section class="profile-header">

            <p class="page-label">
                ACCOUNT
            </p>

            <h1>
                My Profile
            </h1>

            <p>
                Manage your personal information.
            </p>

        </section>


        <section class="profile-card">

            <!-- PROFILE AVATAR -->

            <div class="profile-avatar-section">

                <div
                    id="profileAvatar"
                    class="profile-avatar"
                >
                    👤
                </div>

                <div>

                    <h2 id="profileName">
                        Traveler
                    </h2>

                    <p id="profileEmail">
                        -
                    </p>

                </div>

            </div>


            <!-- PROFILE FORM -->

            <form id="profileForm">

                <div class="profile-form-grid">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            disabled
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            disabled
                        >

                    </div>

                </div>


                <div
                    id="profileMessage"
                    class="profile-message"
                >
                </div>


                <button
                    type="submit"
                    class="save-profile-btn"
                >
                    Save Changes
                </button>

            </form>

        </section>


        <!-- ACCOUNT ACTIONS -->

        <section class="profile-actions">

            <h2>
                Account
            </h2>


            <div class="profile-action-row">

                <div>

                    <h3>
                        Logout
                    </h3>

                    <p>
                        Sign out from your GlobeTrotter account.
                    </p>

                </div>


                <button
                    id="profileLogoutButton"
                    class="profile-logout-btn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>


    <script src="jsfiles/api.js"></script>

    <script src="jsfiles/profile.js"></script>

</body>

</html>
