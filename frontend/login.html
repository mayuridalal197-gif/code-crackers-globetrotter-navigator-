<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - GlobeTrotter</title>

    <link
        rel="stylesheet"
        href="cssfiles/global.css"
    >

    <link
        rel="stylesheet"
        href="cssfiles/auth.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-card">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="auth-logo">

            <h1>
                GlobeTrotter
            </h1>

            <p>
                Welcome back, traveler
            </p>

        </div>


        <!-- =========================
             MESSAGE
        ========================== -->

        <div id="message"></div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-button"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- =========================
             REGISTER
        ========================== -->

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>

</div>


<script src="jsfiles/api.js"></script>

<script src="jsfiles/auth.js"></script>


</body>

</html>
