<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Trips - GlobeTrotter</title>

    <link rel="stylesheet" href="cssfiles/global.css">
    <link rel="stylesheet" href="cssfiles/trip.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
                class="dashboard-logo"
            >
                🌍 GlobeTrotter
            </a>


            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a
                    href="my-trips.html"
                    class="active"
                >
                    My Trips
                </a>

                <a href="community.html">
                    Community
                </a>

            </div>


            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button"
                >
                    👤
                </a>

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- PAGE HEADER -->

    <section class="trips-header">

        <div class="trips-header-content">

            <div>

                <p class="page-label">
                    YOUR JOURNEYS
                </p>

                <h1>
                    My Trips
                </h1>

                <p>
                    Manage all your adventures
                    in one place.
                </p>

            </div>


            <a
                href="create-trip.html"
                class="create-trip-btn"
            >
                + Create New Trip
            </a>

        </div>

    </section>


    <!-- TRIPS -->

    <main class="my-trips-container">

        <div
            id="loading"
            class="trips-loading"
        >
            Loading your trips...
        </div>


        <div
            id="emptyState"
            class="empty-trips"
            style="display: none;"
        >

            <div class="empty-icon">
                ✈️
            </div>

            <h2>
                No trips yet
            </h2>

            <p>
                Start planning your next adventure.
            </p>

            <a
                href="create-trip.html"
                class="create-trip-btn"
            >
                Create Your First Trip
            </a>

        </div>


        <div
            id="tripsGrid"
            class="trips-grid"
        >
        </div>

    </main>


    <script src="jsfiles/api.js"></script>
    <script src="jsfiles/my-trips.js"></script>

</body>

</html>
