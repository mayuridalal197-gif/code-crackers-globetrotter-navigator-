<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community - GlobeTrotter</title>

    <link
        rel="stylesheet"
        href="cssfiles/global.css"
    >

    <style>

        .community-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .community-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .community-header h1 {
            margin: 0 0 8px;
        }

        .community-header p {
            margin: 0;
            opacity: 0.7;
        }

        .create-post-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
        }

        .community-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .create-post-card {
            display: none;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .create-post-card.show {
            display: block;
        }

        .create-post-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .form-actions button {
            padding: 11px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .post-card {
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 22px;
        }

        .post-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .post-author {
            font-weight: 700;
        }

        .post-date {
            font-size: 13px;
            opacity: 0.6;
        }

        .delete-post-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .post-card h2 {
            margin: 18px 0 10px;
        }

        .post-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 15px;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .post-action-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .comments-section {
            margin-top: 18px;
            display: none;
        }

        .comments-section.show {
            display: block;
        }

        .comment-list {
            margin-bottom: 15px;
        }

        .comment {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.04);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .comment-author {
            font-weight: 700;
        }

        .comment-date {
            font-size: 12px;
            opacity: 0.6;
        }

        .comment-text {
            margin: 7px 0 0;
            white-space: pre-wrap;
        }

        .delete-comment-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
        }

        .comment-form {
            display: flex;
            gap: 10px;
        }

        .comment-form input {
            flex: 1;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .comment-form button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading-state,
        .empty-state,
        .error-state {
            padding: 40px;
            text-align: center;
            border-radius: 16px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {

            .community-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .comment-form {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
                class="dashboard-logo"
            >
                🌍 GlobeTrotter
            </a>


            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a href="my-trips.html">
                    My Trips
                </a>

                <a
                    href="community.html"
                    class="active"
                >
                    Community
                </a>

            </div>


            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button"
                >
                    👤
                </a>

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- COMMUNITY -->

    <main class="community-page">


        <header class="community-header">

            <div>

                <p>
                    TRAVEL COMMUNITY
                </p>

                <h1>
                    Explore & Share
                </h1>

                <p>
                    Share your travel experiences,
                    tips and recommendations.
                </p>

            </div>


            <button
                id="createPostButton"
                class="create-post-btn"
                type="button"
            >
                + Create Post
            </button>

        </header>


        <!-- CREATE POST -->

        <section
            id="createPostCard"
            class="create-post-card"
        >

            <h2>
                Create a Post
            </h2>


            <form id="createPostForm">

                <div class="form-group">

                    <label for="postTitle">
                        Title
                    </label>

                    <input
                        type="text"
                        id="postTitle"
                        placeholder="e.g. Best places to visit in Rajasthan"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="postImage">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="postImage"
                        placeholder="https://example.com/image.jpg"
                    >

                </div>


                <div class="form-group">

                    <label for="postContent">
                        Content
                    </label>

                    <textarea
                        id="postContent"
                        placeholder="Share your travel experience..."
                        required
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                    >
                        Publish Post
                    </button>


                    <button
                        type="button"
                        id="cancelPostButton"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- POSTS -->

        <section
            id="postsContainer"
            class="community-layout"
        >

            <div class="loading-state">
                Loading community posts...
            </div>

        </section>


    </main>


    <script src="jsfiles/api.js"></script>

    <script src="jsfiles/community.js"></script>


</body>

</html>
