<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendar - GlobeTrotter</title>

    <link
        rel="stylesheet"
        href="cssfiles/global.css"
    >

    <link
        rel="stylesheet"
        href="cssfiles/calendar.css"
    >

</head>


<body>

    <!-- NAVBAR -->

    <nav class="dashboard-navbar">

        <div class="dashboard-nav">

            <a
                href="dashboard.html"
                class="dashboard-logo"
            >
                🌍 GlobeTrotter
            </a>


            <div class="dashboard-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-trip.html">
                    Create Trip
                </a>

                <a href="my-trips.html">
                    My Trips
                </a>

                <a href="search.html">
                    Search
                </a>

                <a href="community.html">
                    Community
                </a>

                <a
                    href="calendar.html"
                    class="active"
                >
                    Calendar
                </a>

            </div>


            <div class="dashboard-actions">

                <a
                    href="profile.html"
                    class="profile-button"
                >
                    👤
                </a>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- PAGE -->

    <main class="calendar-page">


        <section class="calendar-header">

            <div>

                <p class="calendar-label">
                    PLAN YOUR JOURNEY
                </p>

                <h1>
                    Travel Calendar
                </h1>

                <p>
                    View your upcoming trips and
                    itinerary activities in one place.
                </p>

            </div>


            <a
                href="create-trip.html"
                class="create-trip-button"
            >
                + Create Trip
            </a>

        </section>



        <!-- CALENDAR CONTROLS -->

        <section class="calendar-controls">

            <button
                type="button"
                id="previousMonth"
                class="calendar-nav-button"
            >
                ←
            </button>


            <h2 id="currentMonth">
                Loading...
            </h2>


            <button
                type="button"
                id="nextMonth"
                class="calendar-nav-button"
            >
                →
            </button>

        </section>



        <!-- CALENDAR -->

        <section class="calendar-container">

            <div class="calendar-weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>


            <div
                id="calendarGrid"
                class="calendar-grid"
            >

                <!-- JS will generate dates -->

            </div>

        </section>



        <!-- UPCOMING TRIPS -->

        <section class="upcoming-section">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        YOUR JOURNEYS
                    </p>

                    <h2>
                        Upcoming Trips
                    </h2>

                </div>

            </div>


            <div
                id="upcomingTrips"
                class="upcoming-trips"
            >

                <div class="calendar-loading">
                    Loading trips...
                </div>

            </div>

        </section>


    </main>


    <script src="jsfiles/api.js"></script>

    <script src="jsfiles/calendar.js"></script>


</body>

</html>
