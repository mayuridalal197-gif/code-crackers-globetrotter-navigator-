<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - GlobeTrotter</title>

    <link rel="stylesheet" href="cssfiles/global.css">
    <link rel="stylesheet" href="cssfiles/auth.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <h1>GlobeTrotter</h1>
            <p>Create your travel account</p>
        </div>

        <div id="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-button"
                id="registerButton"
            >
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script src="jsfiles/api.js"></script>
<script src="jsfiles/auth.js"></script>

</body>
</html>
